    function Modal({title,children,onClose,wide=false}){
      const ref=useRef(null);useEffect(()=>{const old=document.activeElement;const previous=document.body.style.overflow;document.body.style.overflow='hidden';const focus=()=>{const target=ref.current?.querySelector('input:not([type=hidden]),select,textarea,button,a[href]');target?.focus({preventScroll:true})};const t=setTimeout(focus,40);const key=e=>{if(e.key==='Escape')onClose();if(e.key==='Tab'){const all=[...(ref.current?.querySelectorAll('button:not(:disabled),a[href],input:not(:disabled),textarea:not(:disabled),select:not(:disabled),[tabindex="0"]')||[])].filter(el=>el.offsetParent!==null);if(!all.length)return;if(e.shiftKey&&document.activeElement===all[0]){e.preventDefault();all[all.length-1].focus()}else if(!e.shiftKey&&document.activeElement===all[all.length-1]){e.preventDefault();all[0].focus()}}};document.addEventListener('keydown',key);return()=>{clearTimeout(t);document.body.style.overflow=previous;document.removeEventListener('keydown',key);old?.focus?.({preventScroll:true})}},[]);

    function ProductGrid({products,onBuy}){return products.length?<div className="products-grid">{products.map(p=><article className="product-card" key={p.id}><div className="product-art"><Icon name={p.icon} size={36}/><span>VIRTUOUS / ARTIST EDITION</span></div><h3>{p.name}</h3><p>{p.type==='digital'?'Conteúdo digital':'Produto físico'} · Demo</p><div className="between" style={{gap:4}}><strong>{money(p.price)}</strong><button className="btn btn-gold btn-sm" onClick={()=>onBuy(p)}><Icon name="ShoppingBag" size={12}/>Comprar</button></div></article>)}</div>:<Empty icon="ShoppingBag" title="A loja está sendo preparada">Em breve, mais formas de apoiar este artista.</Empty>}

    function ArtistForm({user,onSubmit}){const [form,setForm]=useState({name:user.name,city:CITIES[0],genre:GENRES[0],price:650,bio:'',url:'',image:'',repertoires:[REPERTOIRES[1]]});const [error,setError]=useState('');const update=(k,v)=>setForm(f=>({...f,[k]:v}));return <form className="stack" onSubmit={e=>{e.preventDefault();const id=youtubeId(form.url);if(!id){setError('Informe um link válido do YouTube para o portfólio.');return}if(!form.name.trim()||!form.bio.trim()||!form.repertoires.length){setError('Preencha o nome, a bio e ao menos um repertório.');return}onSubmit({name:form.name.trim(),city:form.city,genre:form.genre,price:Number(form.price),bio:form.bio.trim(),image:safeImage(form.image),youtube:id,repertoires:form.repertoires})}}><p className="small muted">Apresente o seu som. Seu portfólio entra no marketplace assim que você salvar.</p><div className="form-grid"><label className="field"><span>Nome artístico ou da banda</span><input className="input" required maxLength={60} value={form.name} onChange={e=>update('name',e.target.value)}/></label><label className="field"><span>Cidade / atendimento</span><select className="input" value={form.city} onChange={e=>update('city',e.target.value)}>{CITIES.map(c=><option key={c}>{c}</option>)}</select></label><label className="field"><span>Gênero principal</span><select className="input" value={form.genre} onChange={e=>update('genre',e.target.value)}>{GENRES.map(g=><option key={g}>{g}</option>)}</select></label><label className="field"><span>Cachê base para 2 horas (R$)</span><input className="input" type="number" min="50" max="100000" step="0.01" required value={form.price} onChange={e=>update('price',e.target.value)}/></label><label className="field full"><span>Bio do artista</span><textarea className="input" rows="3" maxLength={450} required placeholder="Conte o que torna sua apresentação especial…" value={form.bio} onChange={e=>update('bio',e.target.value)}/></label><label className="field full"><span>Vídeo de p     function BookingForm({artist:a,user,onSubmit}){const [form,setForm]=useState({date:'',eventType:'Casamento',duration:2,location:'',notes:'',accepted:false});const [error,setError]=useState('');const amount=a.price*(Number(form.duration)/2);const fee=Math.round(amount*MODEL.bookingFee*100)/100;const update=(k,v)=>setForm(f=>({...f,[k]:v}));return <form className="stack" onSubmit={e=>{e.preventDefault();if(form.date<localDate()){setError('Escolha uma data de hoje em diante.');return}if(!form.location.trim()){setError('Informe o local do evento.');return}onSubmit({...form,location:form.location.trim()})}}><div className="row"><Avatar name={a.name} src={a.image}/><div><strong>{a.name}</strong><p className="tiny muted">{a.city} · Cachê base {money(a.price)} / 2h</p></div><Icon name="ShieldCheck" className="gold" size={23} style={{marginLeft:'auto'}}/></div><div className="form-grid"><label className="field"><span>Data do evento</span><input className="input" type="date" required min={localDate()} value={form.date} onInput={e=>update('date',e.currentTarget.value)} onChange={e=>update('date',e.target.value)}/></label><label className="field"><span>Tipo de evento</span><select className="input" value={form.eventType} onChange={e=>update('eventType',e.target.value)}>{['Casamento','Restaurante/Bar','Festa Privada','Evento Corporativo'].map(t=><option key={t}>{t}</option>)}</select></label><label className="field"><span>Duração da apresentação</span><select className="input" value={form.duration} onChange={e=>update('duration',Number(e.target.value))}>{[1,2,3,4,5,6,7,8].map(n=><option key={n} value={n}>{n} hora{n>1?'s':''}</option>)}</select></label><label className="field"><span>Local do evento</span><input className="input" required maxLength={160} placeholder="Espaço e cidade" value={form.location} onChange={e=>update('location',e.target.value)}/></label><label className="field full"><span>Detalhes para o artista (opcional)</span><textarea className="input" rows="2" max l.</span></label><button type="submit" className="btn btn-gold btn-block"><Icon name="ShoppingBag" size={16}/>Simular compra · {money(p.price)}</button></form>}
    function downloadText(name,text){const url=URL.createObjectURL(new Blob([text],{type:'text/plain;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000)}
    function OrderReceipt({order:o,onClose,onProfile,toast}){return <><div className="success-screen"><div className="check"><Icon name="Check" size={30}/></div><div className="eyebrow" style={{justifyContent:'center'}}>Apoio registrado</div><h3>Um incentivo à próxima nota.</h3><p>{o.name}<br/>Por {o.artist}</p></div><div className="panel" style={{padding:18}}><div className="money-row"><span>Total da compra simulada</span><strong>{money(o.price)}</strong></div><div className="money-row"><span>Data</span><strong>{fmtDate(o.createdAt)}</strong></div><div className="money-row"><span>Status</span><span className="tiny green">{o.status}</span></div>{o.type==='physical'&&<p className="tiny muted" style={{marginTop:10}}>Entrega demonstrativa: {o.address}{o.size&&o.name.includes('Camiseta')?' · Tamanho '+o.size:''}</p>}</div><p className="tiny muted" style={{margin:'16px 0'}}>Este comprovante pertence ao MVP. Não houve cobrança, emissão de licença para o conteúdo de referência ou envio de produto.</p>{o.type==='digital'&&<button className="btn btn-gold btn-block" onClick={()=>{downloadText('virtuous-acesso-demonstrativo.txt',`VIRTUOUS — ACESSO DEMONSTRATIVO\n\nProduto: ${o.name}\nArtista fictício: ${o.artist}\nData: ${fmtDate(o.createdAt)}\nValor simulado: ${money(o.price)}\nPedido: ${o.id}\n\nEste arquivo comprova apenas o fluxo de aquisição no MVP acadêmico.\nNenhuma partitura, curso, backing track ou licença comercial de artista real está sendo vendida ou fornecida.\n\nSugestão de rotina de estudo: afinação, aquecimento leve, pulso com metrônomo e prática lenta de trechos curtos.\n\nTeam Seed — SI800B / FT Unicamp`);toast('Comprovante demonstrativo baixado.')}}><Icon name="Download" size={15}/>Baixar acesso demonstrativo (.txt)</button>}<button className="btn btn-outline btn-block" style={{marginTop:12}} onClick={onProfile}>Ver minhas compras<Icon name="ArrowRight" size={15}/></button></>}
    function BookingReceipt({booking:b,user,onClose,toast}){return <><div className="success-screen"><div className="check"><Icon name="CalendarCheck" size={28}/></div><span className="badge badge-green">{b.code}</span><h3>Um novo palco está a caminho.</h3><p>Solicitação registrada na demo.<br/>Nenhuma reserva foi enviada ao artista.</p></div><div className="panel" style={{padding:19}}><div className="money-row"><span>Artista</span><strong>{b.artist}</strong></div><div className="money-row"><span>Evento</span><strong>{b.eventType}</strong></div><div className="money-row"><span>Data · Duração</span><strong>{fmtDate(b.date)} · {b.duration}h</strong></div><div className="money-row"><span>Cachê do artista</span><strong>{money(b.artistAmount)}</strong></div><div className="money-row"><span>Intermediação (10%)</span><strong>{money(b.fee)}</strong></div><div className="money-row total"><span>Total</span><strong>{money(b.total)}</strong></div></div><div className="notice" style={{margin:'17px 0'}}><Icon name="FileCheck2" size={17}/><span>Contrato de demonstração entre {user.name||'Contratante'}, {b.artist} e Virtuous. Local: {b.location}. Custódia prevista apenas como proposta do modelo. Sem validade jurídica ou cobrança.</span></div><button className="btn btn-gold btn-block" onClick={()=>{downloadText('virtuous-contrato-'+b.code+'.txt',`VIRTUOUS — CONTRATO DEMONSTRATIVO SEM VALIDADE JURÍDICA\nCódigo: ${b.code}\n\nContratante: ${user.name}\nArtista fictício: ${b.artist}\nTipo de evento: ${b.eventType}\nData: ${fmtDate(b.date)}\nDuração: ${b.duration} horas\nLocal: ${b.location}\nObservações: ${b.notes||'Nenhuma'}\n\nCachê: ${money(b.artistAmount)}\nIntermediação Virtuous (10%): ${money(b.fee)}\nTotal: ${money(b.total)}\n\nPROPOSTA DE FLUXO\nO contratante depositaria o total em custódia. Após a apresentação e confirmação da entrega, o cachê seria liberado ao artista. A taxa de processamento seria absorvida pela intermediação.\n\nEste documento pertence exclusivamente a um MVP acadêmico. Não há pagamento, assinatura, vínculo jurídico, garantia real de custódia ou reserva de agenda.\n\nTeam Seed — SI800B / FT Unicamp`);toast('Contrato demonstrativo baixado.')}}><Icon name="Download" size={16}/>Baixar contrato demonstrativo (.txt)</button><button className="btn btn-quiet btn-block" style={{marginTop:9}} onClick={onClose}>Continuar explorando</button></>}
    function TopicCard({topic:t,liked,onLike,onOpen}){return <article className="topic"><div className="between"><span className="badge badge-blue">{t.tag||t.category}</span><span className="tiny muted">{fmtDate(t.createdAt)}</span></div><button onClick={onOpen} style={{background:'none',border:0,padding:0,textAlign:'left',width:'100%'}}><h3>{t.title}</h3></button><p className="topic-content">{t.body.length>220?t.body.slice(0,220)+'…':t.body}</p><div className="between" style={{marginTop:16}}><div className="row" style={{gap:7}}><Avatar name={t.author} className="mini-avatar"/><span className="tiny muted">{t.author}</span></div><div className="row" style={{gap:17}}><button className={'topic-action '+(liked?'active':'')} onClick={onLike} aria-label={'Curtir tópico: '+t.title} aria-pressed={liked}><Icon name="Heart" size={14}/>{t.likes}</button><button className="topic-action" onClick={onOpen}><Icon name="MessageCircle" size={14}/>{t.replies.length} respostas</button></div></div></article>}
    function Thread({topic:t,liked,onLike,onReply,user}){const [reply,setReply]=useState('');return <><span className="badge badge-blue">{t.category}</span><h3 className="serif" style={{fontSize:27,margin:'18px 0 12px'}}>{t.title}</h3><p className="tiny muted" style={{marginBottom:17}}>Por {t.author} · {fmtDate(t.createdAt)}</p><p className="topic-content">{t.body}</p><div className="topic-footer"><button className={'topic-action '+(liked?'active':'')} onClick={onLike} aria-pressed={liked}><Icon name="Heart" size={15}/>{t.likes} curtidas</button><span className="tiny muted">{t.replies.length} respostas</span></div><div className="divider"/>{t.replies.map(r=><div className="reply" key={r.id}><div className="between"><strong className="tiny">{r.author}</strong><span className="tiny muted">{fmtDate(r.createdAt)}</span></div><p>{r.body}</p></div>)}<form onSubmit={e=>{e.preventDefault();if(reply.trim()){onReply(reply.trim());setReply('')}}} style={{marginTop:23}}><label className="field"><span>Sua resposta · {user.name}</span><textarea className="input" required maxLength={2000} rows="3" value={reply} placeholder="Compartilhe uma referência, uma ideia ou sua experiência…" onChange={e=>setReply(e.target.value)}/></label><button className="btn btn-gold" style={{marginTop:13}} type="submit" disabled={!reply.trim()}><Icon name="Send" size={15}/>Publicar resposta</button></form></>}
    function TopicForm({onSubmit}){const [form,setForm]=useState({title:'',body:'',category:COMMUNITY_CATEGORIES[0],tag:''});return <form className="stack" onSubmit={e=>{e.preventDefault();if(!form.title.trim()||!form.body.trim())return;onSubmit({...form,title:form.title.trim(),body:form.body.trim(),tag:form.tag.trim()||form.category})}}><label className="field"><span>Canal de discussão</span><select className="input" value={form.category} onChange={e=>setForm(f=>({...f,category:e.target.value}))}>{COMMUNITY_CATEGORIES.map(c=><option key={c}>{c}</option>)}</select></label><label className="field"><span>Título do tópico</span><input className="input" maxLength={120} required placeholder="O que você quer compartilhar?" value={form.title} onChange={e=>setForm(f=>({...f,title:e.target.value}))}/></label><label className="field"><span>Artista, instrumento ou local (opcional)</span><input className="input" maxLength={45} placeholder="Ex.: Violão, Quarteto Aurora, Campinas…" value={form.tag} onChange={e=>setForm(f=>({...f,tag:e.target.value}))}/></label><label className="field"><span>Vamos conversar</span><textarea className="input" rows="5" required maxLength={3000} placeholder="Conte sua ideia e abra espaço para a comunidade…" value={form.body} onChange={e=>setForm(f=>({...f,body:e.target.value}))}/></label><button className="btn btn-gold btn-block" type="submit"><Icon name="MessagesSquare" size={16}/>Publicar tópico</button></form>}
    function Simulator({values:s,onChange}){
      const subNet=netAfterGateway(MODEL.subscription),ticketNet=netAfterGateway(MODEL.ticket);const artistSubs=s.subscribers*subNet*.5,platformSubs=s.subscribers*subNet*.5,artistTickets=s.tickets*ticketNet*.8,platformTickets=s.tickets*ticketNet*.2;const bookingTotal=s.eventBase*(1+MODEL.bookingFee),bookingGateway=bookingTotal*MODEL.gatewayRate+MODEL.gatewayFixed,platformEvents=s.events*(s.eventBase*MODEL.bookingFee-bookingGateway),artistEvents=s.events*s.eventBase;const merchNet=netAfterGateway(s.merchPrice),artistMerch=s.merch*merchNet*MODEL.merchArtist,platformMerch=s.merch*merchNet*(1-MODEL.merchArtist);const artist=artistSubs+artistTickets+artistEvents+artistMerch;const platform=platformSubs+platformTickets+platformEvents+platformMerch;const operational=platform-MODEL.fixedCost;const breakEven=Math.ceil(MODEL.fixedCost/(subNet*.5));const conventional=Math.ceil(artist/Math.max(.0001,s.streamRate));const field=(key,value)=>onChange({[key]:Number(value)});
      return <><div className="quick-presets"><button className="chip" onClick={()=>onChange({subscribers:20,tickets:0,events:0,merch:0})}>20 assinantes · ponto de equilíbrio</button><button className="chip" onClick={()=>onChange({subscribers:100,tickets:200,events:0,merch:0})}>Cenário do projeto · 100 + 200</button><button className="chip" onClick={()=>onChange({subscribers:300,tickets:400,events:4,merch:30})}>Explorar crescimento</button><button className="chip" onClick={()=>onChange({subscribers:0,tickets:0,events:0,merch:0})}>Zerar cenário</button></div><div className="sim-layout"><section className="panel"><div className="slider-block"><div className="between"><div className="row"><Icon name="Crown" size={19} className="gold"/><label htmlFor="subscribers" className="slider-title">Assinantes mensais</label></div><output className="slider-number" htmlFor="subscribers">{number(s.subscribers)}</output></div><p>R$ 29,90/mês · Gateway 4% + R$ 0,39<br/>Divisão 50/50: {money(subNet*.5)} para cada ponta, por assinatura.</p><input id="subscribers" type="range" min="0" max="1000" step="1" value={s.subscribers} onChange={e=>field('subscribers',e.target.value)}/><div className="range-limits"><span>0 assinantes</span><span>1.000 assinantes</span></div></div><div className="slider-block"><div className="between"><div className="row"><Icon name="Ticket" size={19} className="gold"/><label htmlFor="live-tickets" className="slider-title">Ingressos de lives no mês</label></div><output className="slider-number" htmlFor="live-tickets">{number(s.tickets)}</output></div><p>Ticket R$ 30 · Gateway 4% + R$ 0,39<br/>80% artista ({money(ticketNet*.8)}) / 20% Virtuous ({money(ticketNet*.2)}).</p><input id="live-tickets" type="range" min="0" max="1000" step="1" value={s.tickets} onChange={e=>field('tickets',e.target.value)}/><div className="range-limits"><span>0 ingressos</span><span>1.000 ingressos</span></div></div><div className="slider-block"><div className="eyebrow" style={{fontSize:8,marginBottom:17}}>3 · Novas frentes do MVP — hipóteses comerciais</div><div className="between"><div className="row"><Icon name="CalendarDays" size={19} className="gold"/><label htmlFor="events" className="slider-title">Eventos contratados</label></div><output className="slider-number" htmlFor="events">{s.events}</output></div><p>Cachê médio {money(s.eventBase)} + 10% de taxa. Gateway absorvido pela taxa. Artista recebe o cachê integral.</p><input id="events" type="range" min="0" max="30" value={s.events} onChange={e=>field('events',e.target.value)}/><div className="between" style={{marginTop:23}}><div className="row"><Icon name="ShoppingBag" size={19} className="gold"/><label htmlFor="merch" className="slider-title">Vendas de merch & partituras</label></div><output className="slider-number" htmlFor="merch">{s.merch}</output></div><p>Ticket médio {money(s.merchPrice)} · Após gateway: 85% artista / 15% Virtuous.</p><input id="merch" type="range" min="0" max="200" value={s.merch} onChange={e=>field('merch',e.target.value)}/><details className="help-details"><summary>Ajustar valores médios</summary><div className="form-grid" style={{marginTop:15}}><label className="field"><span>Cachê médio por evento (R$)</span><input className="input" type="number" min="50" max="100000" step="10" value={s.eventBase} onChange={e=>field('eventBase',Math.max(50,Math.min(100000,Number(e.target.value)||50)))}/></label><label className="field"><span>Valor médio de produto (R$)</span><input className="input" type="number" min="5" max="5000" step="0.1" value={s.merchPrice} onChange={e=>field('merchPrice',Math.max(5,Math.min(5000,Number(e.target.value)||5)))}/></label></div></details></div></section><div className="stack"><div className="results-grid"><div className="metric metric-featured"><div className="between"><span className="eyebrow" style={{fontSize:9}}>Para os artistas</span><Icon name="HeartHandshake" size={23} className="gold"/></div><p>Receita distribuída após gateway e comissões</p><strong>{money(artist)}</strong><span className="tiny muted">por mês · total do conjunto de artistas</span><div className="divider" style={{margin:'18px 0'}}/><p className="tiny" style={{margin:0,lineHeight:1.9}}>Comparação ilustrativa: seriam {number(conventional)} reproduções a {'R$ '+s.streamRate.toLocaleString('pt-BR',{minimumFractionDigits:3,maximumFractionDigits:3})} por reprodução para o mesmo valor. A taxa varia por serviço e contexto; não é uma cotação de mercado.</p><label className="field" style={{marginTop:12}}><span>Hipótese por reprodução (R$)</span><input style={{maxWidth:160,padding:'6px 10px',minHeight:34}} aria-label="Valor hipotético por reprodução" className="input" type="number" min="0.001" max="1" step="0.001" value={s.streamRate} onChange={e=>field('streamRate',Math.max(.001,Math.min(1,Number(e.target.value)||.001)))}/></label></div><div className="metric"><Icon name="Building2" size={19} style={{color:'#83b1fa'}}/><p>Receita da plataforma após gateway e repasses</p><strong>{money(platform)}</strong><span className="tiny muted">antes do custo fixo base</span></div><div className="metric"><Icon name="Server" size={19} className="muted"/><p>Custo tecnológico fixo base</p><strong>{money(MODEL.fixedCost)}</strong><span className="tiny muted">hospedagem + domínio / mês</span></div><div className="metric" style={{gridColumn:'1 / -1',borderColor:operational>=0?'#71d4ae40':'#f59e0b40'}}><div className="between"><p style={{margin:0}}>Resultado após custo tecnológico</p><span className={'badge '+(operational>=0?'badge-green':'')}>{operational>=0?'BASE COBERTA':'EM VALIDAÇÃO'}</span></div><strong style={{color:operational>=0?'#8be1be':'#f4c069',marginTop:12}}>{money(operational)}</strong><div className="progress-track" role="progressbar" aria-label="Cobertura do custo tecnológico" aria-valuemin="0" aria-valuemax="100" aria-valuenow={Math.round(Math.min(100,platform/MODEL.fixedCost*100))}><div className="progress-fill" style={{width:Math.min(100,Math.max(0,platform/MODEL.fixedCost*100))+'%'}}/></div><div className="between tiny muted"><span>{Math.round(platform/MODEL.fixedCost*100)}% do custo base coberto</span><span>{breakEven} assinantes já cobrem a base</span></div></div></div><div className="notice"><Icon name="Info" size={18}/><span><strong>Premissas do projeto:</strong> assinatura, ticket, gateway, repasses 50/50 e 80/20, custo base de R$ 273. Eventos (+10%) e loja (85/15) são hipóteses adicionais deste MVP. Resultado ainda exclui impostos, direitos autorais, marketing, pessoal, produção, logística e outros custos. Não equivale a lucro líquido.</span></div></div></div><section className="panel" style={{marginBottom:40,overflowX:'auto'}}><div className="between"><div><div className="eyebrow" style={{fontSize:9}}>Uma conta que você pode conferir</div><h3 className="serif" style={{fontSize:25,marginTop:8}}>Para onde vai o valor?</h3></div><Icon name="Scale" size={22} className="gold"/></div><table className="formula-table"><thead><tr><th>Origem</th><th>Artistas</th><th>Virtuous</th></tr></thead><tbody>{[['Assinaturas',artistSubs,platformSubs],['Ingressos de lives',artistTickets,platformTickets],['Eventos (hipótese)',artistEvents,platformEvents],['Merch & partituras (hipótese)',artistMerch,platformMerch]].map(([label,a,p])=><tr key={label}><td>{label}</td><td>{money(a)}</td><td>{money(p)}</td></tr>)}<tr><td><strong>Total após processamento</strong></td><td><strong>{money(artist)}</strong></td><td><strong>{money(platform)}</strong></td></tr></tbody></table><p className="tiny muted" style={{marginTop:17}}>Cálculos com precisão integral; valores exibidos arredondados para centavos. 100 assinantes + 200 tickets: R$ 2.279,10 após taxas, repasses e custo tecnológico base. O total de artistas não representa o ganho individual de cada músico.</p></section></>;
    }
    class ErrorBoundary extends React.Component{constructor(p){super(p);this.state={error:false}}static getDerivedStateFromError(){return {error:true}}render(){if(this.state.error)return <div style={{padding:60,textAlign:'center'}}><h1 className="gold" style={{fontSize:40}}>Vamos afinar de novo.</h1><p className="muted" style={{margin:'20px 0'}}>Não foi possível abrir os dados desta demonstração. Você pode restaurar os exemplos.</p><button className="btn btn-gold" onClick={()=>{try{localStorage.removeItem(STORAGE_KEY)}catch{}location.reload()}}>Restaurar demo</button></div>;return this.props.children}}
    ReactDOM.createRoot(document.getElementById('root')).render(<ErrorBoundary><App/></ErrorBoundary>);
  </script>
